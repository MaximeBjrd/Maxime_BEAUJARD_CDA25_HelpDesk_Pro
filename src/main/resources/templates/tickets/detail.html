<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <meta charset="UTF-8">
        <title>Détail ticket - HelpDesk Pro</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>

    <body class="bg-light">
        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" href="/tickets">🎫 HelpDesk Pro</a>
                <div class="navbar-nav ms-auto">
                    <th:block th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
                        <a class="nav-link" href="/admin/dashboard">📊 Dashboard</a>
                        <a class="nav-link" href="/tickets/new">➕ Nouveau ticket</a>
                    </th:block>
                    <span class="nav-link text-light">
                        👤 <sec:authentication property="name"/>
                    </span>
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-outline-light btn-sm ms-2">Déconnexion</button>
                    </form>
                </div>
            </div>
        </nav>

        <div class="container mt-4">
            <a href="/tickets" class="btn btn-outline-secondary btn-sm mb-3">← Retour</a>
            <div class="row">
                <!-- Infos ticket -->
                <div class="col-md-8">
                    <div class="card shadow-sm mb-4">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <h4 class="mb-0" th:text="${ticket.title}"></h4>
                            <span th:if="${ticket.late}" class="badge bg-danger">EN RETARD</span>
                        </div>
                        <div class="card-body">
                            <p th:text="${ticket.description}" class="mb-3"></p>
                            <div class="row">
                                <div class="col-md-6">
                                    <p><strong>Client :</strong> <span th:text="${ticket.client}"></span></p>
                                    <p><strong>Catégorie :</strong> <span th:text="${ticket.category}"></span></p>
                                    <p><strong>Créé le :</strong>
                                        <span th:text="${#temporals.format(ticket.createdAt, 'dd/MM/yyyy HH:mm')}"></span>
                                    </p>
                                </div>
                                <div class="col-md-6">
                                    <p><strong>Priorité :</strong> <span th:text="${ticket.priority}"></span></p>
                                    <p><strong>Statut :</strong> <span th:text="${ticket.status}"></span></p>
                                    <p><strong>Technicien :</strong>
                                        <span th:text="${ticket.technician != null} ? ${ticket.technician.name} : 'Non assigné'"></span>
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Commentaires -->
                    <div class="card shadow-sm mb-4">
                        <div class="card-header"><h5 class="mb-0">💬 Commentaires</h5></div>
                        <div class="card-body">
                            <div th:if="${#lists.isEmpty(comments)}" class="text-muted">
                                Aucun commentaire pour l'instant.
                            </div>
                            <div th:each="comment : ${comments}" class="border-bottom pb-2 mb-2">
                                <div class="d-flex justify-content-between">
                                    <strong th:text="${comment.author.name}"></strong>
                                    <small class="text-muted"
                                           th:text="${#temporals.format(comment.createdAt, 'dd/MM/yyyy HH:mm')}">
                                    </small>
                                </div>
                                <p th:text="${comment.content}" class="mb-0 mt-1"></p>
                            </div>

                            <!-- Formulaire ajout commentaire -->
                            <div th:if="${ticket.status.name() != 'FERME'}">
                                <form th:action="@{/tickets/{id}/comment(id=${ticket.id})}" method="post" class="mt-3">
                                    <div class="mb-2">
                                        <textarea name="content" class="form-control" rows="3"
                                                  placeholder="Ajouter un commentaire..." required></textarea>
                                    </div>
                                    <button type="submit" class="btn btn-primary btn-sm">Envoyer</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Actions -->
                <div class="col-md-4">

                    <!-- Changer statut -->
                    <div class="card shadow-sm mb-3" th:if="${ticket.status.name() != 'FERME'}">
                        <div class="card-header"><h6 class="mb-0">🔄 Changer le statut</h6></div>
                        <div class="card-body">
                            <form th:action="@{/tickets/{id}/status(id=${ticket.id})}" method="post">
                                <select name="status" class="form-select mb-2">
                                    <option th:each="s : ${statuses}"
                                            th:value="${s}"
                                            th:text="${s}"
                                            th:selected="${s == ticket.status}">
                                    </option>
                                </select>
                                <button type="submit" class="btn btn-warning btn-sm w-100">Mettre à jour</button>
                            </form>
                        </div>
                    </div>

                    <!-- Affecter technicien (admin) -->
                    <th:block th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
                        <div class="card shadow-sm mb-3" th:if="${ticket.status.name() != 'FERME'}">
                            <div class="card-header"><h6 class="mb-0">👤 Affecter un technicien</h6></div>
                            <div class="card-body">
                                <form th:action="@{/tickets/{id}/assign(id=${ticket.id})}" method="post">
                                    <select name="technicianId" class="form-select mb-2">
                                        <option value="">-- Choisir --</option>
                                        <option th:each="tech : ${technicians}"
                                                th:value="${tech.id}"
                                                th:text="${tech.name}"
                                                th:selected="${ticket.technician != null && ticket.technician.id == tech.id}">
                                        </option>
                                    </select>
                                    <button type="submit" class="btn btn-info btn-sm w-100">Affecter</button>
                                </form>
                            </div>
                        </div>

                        <!-- Supprimer (admin) -->
                        <div class="card shadow-sm mb-3">
                            <div class="card-body">
                                <form th:action="@{/tickets/{id}/delete(id=${ticket.id})}" method="post"
                                      onsubmit="return confirm('Supprimer ce ticket ?')">
                                    <button type="submit" class="btn btn-danger btn-sm w-100">🗑️ Supprimer</button>
                                </form>
                            </div>
                        </div>
                    </th:block>
                </div>
            </div>
        </div>
    </body>
</html>
