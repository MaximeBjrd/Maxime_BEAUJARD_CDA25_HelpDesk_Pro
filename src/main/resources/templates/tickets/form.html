<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Nouveau ticket - HelpDesk Pro</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>

    <body class="bg-light">
        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" href="/tickets">🎫 HelpDesk Pro</a>
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" href="/admin/dashboard">📊 Dashboard</a>
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-outline-light btn-sm ms-2">Déconnexion</button>
                    </form>
                </div>
            </div>
        </nav>

        <div class="container mt-4">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="card shadow-sm">
                        <div class="card-header">
                            <h4 class="mb-0">➕ Nouveau ticket</h4>
                        </div>
                        <div class="card-body">
                            <form th:action="@{/tickets/new}" method="post">
                                <div class="mb-3">
                                    <label class="form-label fw-bold">Titre *</label>
                                    <input type="text" name="title" class="form-control"
                                           placeholder="Ex: Problème réseau bureau 3"
                                           required minlength="3">
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-bold">Description *</label>
                                    <textarea name="description" class="form-control" rows="4"
                                              placeholder="Décrivez le problème en détail..."
                                              required minlength="10"></textarea>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-bold">Client (société) *</label>
                                    <input type="text" name="client" class="form-control"
                                           placeholder="Ex: Entreprise Martin"
                                           required>
                                </div>

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label fw-bold">Priorité *</label>
                                        <select name="priority" class="form-select" required>
                                            <option value="">-- Choisir --</option>
                                            <option value="BASSE">Basse</option>
                                            <option value="MOYENNE">Moyenne</option>
                                            <option value="HAUTE">Haute</option>
                                            <option value="CRITIQUE">Critique</option>
                                        </select>
                                    </div>

                                    <div class="col-md-6 mb-3">
                                        <label class="form-label fw-bold">Catégorie *</label>
                                        <select name="category" class="form-select" required>
                                            <option value="">-- Choisir --</option>
                                            <option value="RESEAU">Réseau</option>
                                            <option value="MATERIEL">Matériel</option>
                                            <option value="LOGICIEL">Logiciel</option>
                                            <option value="SECURITE">Sécurité</option>
                                            <option value="AUTRE">Autre</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="d-flex gap-2">
                                    <button type="submit" class="btn btn-primary">Créer le ticket</button>
                                    <a href="/tickets" class="btn btn-outline-secondary">Annuler</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
