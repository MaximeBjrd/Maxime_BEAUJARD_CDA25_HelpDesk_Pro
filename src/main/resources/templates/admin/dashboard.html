<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Dashboard - HelpDesk Pro</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>

    <body class="bg-light">
        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" href="/tickets">🎫 HelpDesk Pro</a>
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" href="/tickets">📋 Tickets</a>
                    <a class="nav-link" href="/tickets/new">➕ Nouveau ticket</a>
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-outline-light btn-sm ms-2">Déconnexion</button>
                    </form>
                </div>
            </div>
        </nav>

        <div class="container mt-4">
            <h2 class="mb-4">📊 Tableau de bord</h2>
            <!-- Compteurs par statut -->
            <div class="row mb-4">
                <div class="col-md-3">
                    <div class="card text-white bg-primary shadow-sm">
                        <div class="card-body text-center">
                            <h1 th:text="${totalTickets}">0</h1>
                            <p class="mb-0">Total tickets</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card text-white bg-info shadow-sm">
                        <div class="card-body text-center">
                            <h1 th:text="${openTickets}">0</h1>
                            <p class="mb-0">Ouverts</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card text-white bg-warning shadow-sm">
                        <div class="card-body text-center">
                            <h1 th:text="${inProgressTickets}">0</h1>
                            <p class="mb-0">En cours</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card text-white bg-success shadow-sm">
                        <div class="card-body text-center">
                            <h1 th:text="${closedTickets}">0</h1>
                            <p class="mb-0">Fermés</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tickets par priorité -->
            <div class="card shadow-sm mb-4">
                <div class="card-header"><h5 class="mb-0">🎯 Tickets par priorité</h5></div>
                <div class="card-body">
                    <div class="row text-center">
                        <div class="col-md-3">
                            <span class="badge bg-secondary fs-5"
                                  th:text="${#lists.size(allTickets.?[priority.name() == 'BASSE'])}">0</span>
                            <p class="mt-1">Basse</p>
                        </div>
                        <div class="col-md-3">
                            <span class="badge bg-info fs-5"
                                  th:text="${#lists.size(allTickets.?[priority.name() == 'MOYENNE'])}">0</span>
                            <p class="mt-1">Moyenne</p>
                        </div>
                        <div class="col-md-3">
                            <span class="badge bg-warning fs-5"
                                  th:text="${#lists.size(allTickets.?[priority.name() == 'HAUTE'])}">0</span>
                            <p class="mt-1">Haute</p>
                        </div>
                        <div class="col-md-3">
                            <span class="badge bg-danger fs-5"
                                  th:text="${#lists.size(allTickets.?[priority.name() == 'CRITIQUE'])}">0</span>
                            <p class="mt-1">Critique</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tickets en retard -->
            <div class="card shadow-sm">
                <div class="card-header bg-danger text-white">
                    <h5 class="mb-0">⏰ Tickets en retard
                        <span class="badge bg-white text-danger ms-2"
                              th:text="${#lists.size(lateTickets)}">0</span>
                    </h5>
                </div>
                <div class="card-body p-0">
                    <div th:if="${#lists.isEmpty(lateTickets)}" class="p-3 text-muted">
                        Aucun ticket en retard 🎉
                    </div>
                    <table th:if="${!#lists.isEmpty(lateTickets)}" class="table table-hover mb-0">
                        <thead class="table-dark">
                        <tr>
                            <th>#</th>
                            <th>Titre</th>
                            <th>Client</th>
                            <th>Priorité</th>
                            <th>Statut</th>
                            <th>Créé le</th>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="ticket : ${lateTickets}">
                            <td th:text="${ticket.id}"></td>
                            <td th:text="${ticket.title}"></td>
                            <td th:text="${ticket.client}"></td>
                            <td th:text="${ticket.priority}"></td>
                            <td th:text="${ticket.status}"></td>
                            <td th:text="${#temporals.format(ticket.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                            <td>
                                <a th:href="@{/tickets/{id}(id=${ticket.id})}"
                                   class="btn btn-sm btn-outline-primary">Voir</a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </body>
</html>
